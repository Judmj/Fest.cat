<style>
  :root{
    --bg:#080b26;
    --surface:#11153a;
    --surface-2:#181d49;
    --text:#f7f7f2;
    --muted:#8d90b8;
    --line: rgba(247,247,242,0.09);

    --coral:#e9846f;
    --coral-soft:#f2ab9c;
    --cyan:#23ffeb;
    --cyan-soft:#7fe8db;

    --font-display:'Archivo Black', 'Arial Black', sans-serif;
    --font-body:'Archivo', sans-serif;
    --font-label:'Archivo', sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
  }
  a{color:inherit;}
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 20px 80px;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(11,11,18,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:760px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .logo{
    height:38px;
    display:block;
  }

  /* ---------- Nav & Filters ---------- */
  .top-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .filter-input, .filter-select{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-label);
    font-size:0.75rem;
    font-weight:600;
    padding:6px 10px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s;
    height:34px;
  }
  .filter-input{
    width:110px;
  }
  .filter-input::placeholder{
    color:var(--muted);
  }
  .filter-select{
    max-width:120px;
    cursor:pointer;
  }
  .filter-input:focus, .filter-select:focus{
    border-color:var(--cyan);
  }
  .filter-select option{
    background:var(--surface-2);
    color:var(--text);
  }

  .top-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    color:var(--cyan);
    opacity:0.85;
    transition:opacity .15s, background .15s;
    flex-shrink:0;
  }
  .top-link:hover{opacity:1; background:var(--surface);}

  /* ---------- Hero ---------- */
  .hero{
    padding:44px 0 28px;
  }
  .hero-eyebrow{
    font-family:var(--font-label);
    font-weight:800;
    font-size:0.8rem;
    color:var(--cyan);
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-bottom:10px;
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(2.4rem, 9vw, 3.6rem);
    line-height:0.95;
    text-transform:uppercase;
    margin:0 0 14px;
  }
  .hero p{
    color:var(--muted);
    font-size:1rem;
    max-width:46ch;
    margin:0;
  }
  .hero-stats{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat-pill{
    font-family:var(--font-label);
    font-weight:700;
    font-size:0.78rem;
    background:var(--surface);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
    color:var(--text);
  }
  .stat-pill b{color:var(--cyan);}

  /* ---------- Date group ---------- */
  .date-group{margin-top:38px;}
  .date-band{
    display:inline-flex;
    align-items:baseline;
    gap:8px;
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:1.05rem;
    letter-spacing:0.01em;
    color:var(--bg);
    padding:9px 16px;
    border-radius:10px;
    margin-bottom:16px;
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border-left:6px solid var(--coral);
    border-radius:16px;
    padding:22px 22px 20px;
    margin-bottom:16px;
  }
  .card .festival{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:clamp(1.5rem, 5.5vw, 1.9rem);
    line-height:1.05;
    margin:0 0 6px;
  }
  .card .artists{
    color:var(--muted);
    font-size:1rem;
    font-weight:500;
    margin:0;
  }
  .card .meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .meta-item{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:var(--font-label);
    font-weight:600;
    font-size:0.82rem;
    background:var(--surface-2);
    padding:7px 12px;
    border-radius:999px;
    color:var(--text);
  }
  .meta-item svg{flex-shrink:0; opacity:0.85;}

  /* ---------- Past section ---------- */
  .past-toggle{
    width:100%;
    margin-top:46px;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--font-label);
    font-weight:700;
    font-size:0.85rem;
    padding:14px 18px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color .15s, color .15s;
  }
  .past-toggle:hover{border-color:var(--muted); color:var(--text);}
  .past-toggle svg{transition:transform .2s;}
  .past-toggle.open svg{transform:rotate(180deg);}

  #past-content{
    display:none;
    margin-top:18px;
    filter:grayscale(0.85);
    opacity:0.55;
  }
  #past-content .date-group{margin-top:26px;}
  #past-content .date-band{
    background:var(--surface-2) !important;
    color:var(--muted) !important;
  }
  #past-content .card{border-left-color: var(--line);}
  #past-content.open{display:block;}

  /* ---------- States ---------- */
  .loading, .empty, .error{
    color:var(--muted);
    font-family:var(--font-label);
    font-weight:600;
    font-size:0.9rem;
    padding:30px 0;
  }
  .error{color:var(--coral);}

  footer{
    max-width:760px;
    margin:60px auto 0;
    padding:20px 20px 40px;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-family:var(--font-label);
    font-weight:600;
    font-size:0.78rem;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  footer a{color:var(--cyan-soft); text-decoration:none;}

  @media (max-width:600px){
    .top-inner{padding:10px 16px;}
    .filter-controls{width:100%; order:3; justify-content:space-between;}
    .filter-input, .filter-select{flex:1; min-width:0;}
    .hero{padding:24px 0 20px;}
  }
</style>
</head>
